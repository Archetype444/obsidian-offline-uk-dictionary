<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><title>Offline dictionary integration fixture</title>
<link rel="stylesheet" href="/styles.css">
<style>
:root {--text-normal:#252723;--text-muted:#72776c;--text-faint:#92978a;--text-accent:#566f4f;--text-success:#557a4c;--background-primary:#fafbf8;--background-secondary:#f0f2ed;--background-modifier-border:#dfe3d9;--background-modifier-hover:#e6ebdf;--font-interface:system-ui,sans-serif;--font-text:Georgia,serif}
* {box-sizing:border-box} body {margin:0;background:#f3f4ef;color:var(--text-normal);font-family:system-ui,sans-serif} header {padding:12px 24px;border-bottom:1px solid var(--background-modifier-border);display:flex;gap:8px;align-items:center} header strong {margin-right:auto;font-size:13px} button,input {font:inherit} button {cursor:pointer;border:1px solid var(--background-modifier-border);border-radius:6px;padding:6px 10px;background:var(--background-primary)} input {border:1px solid var(--background-modifier-border);border-radius:6px;padding:7px 9px;background:var(--background-primary);color:inherit}.mod-cta {background:#566f4f;color:#fff;border-color:#566f4f} main {padding:32px;flex:1;min-width:0;overflow:auto} .layout {display:flex;height:calc(100vh - 54px)} main h1 {font:30px Georgia,serif} .fixture {padding:18px;background:#fafbf8;border:1px solid #e2e5dd;border-radius:9px;margin:14px 0;line-height:1.8}.fixture small {display:block;color:#7c8273;font-size:10px;text-transform:uppercase;letter-spacing:1px}.sample {font:21px Georgia,serif;display:inline-block;margin-top:10px}.pdf-page {background:white;box-shadow:0 3px 8px #30352212}.right {width:370px;border-left:1px solid #dfe3d9;background:var(--background-primary);display:flex;flex-direction:column}.right.collapsed {display:none}.tabs {display:flex;gap:2px;padding:8px;border-bottom:1px solid #dfe3d9;font-size:11px}.tab.active {background:#e5ebdf}.view-host {flex:1;min-height:0;display:none}.view-host.active {display:flex;flex-direction:column}.view-content {height:100%}.other-content {padding:30px;color:#777}.test-context-menu {position:fixed;z-index:99;min-width:160px;background:#fff;border:1px solid #dce0d4;box-shadow:0 8px 30px #0002;border-radius:7px;padding:5px}.test-context-menu button {display:block;width:100%;border:0;text-align:left;background:white}.test-context-menu button:hover {background:#edf0e8} iframe {width:100%;height:100px;border:0}.lookup-ribbon {font-size:12px}
</style></head><body>
<header><strong>Obsidian API integration fixture</strong><button id="collapse">Toggle right sidebar</button><button id="other">Other sidebar tab</button></header>
<div class="layout"><main>
<h1>Words, wherever you read</h1>
<div class="fixture"><small>Markdown reading view</small><span class="sample" data-testid="reading-word">colour</span></div>
<div class="fixture pdf-page"><small>PDF-style selectable text layer</small><span class="sample" data-testid="pdf-word">centre</span></div>
<div class="fixture"><small>Editable text</small><textarea data-testid="text-input">organise</textarea></div>
<div class="fixture"><small>Same-origin embedded view</small><iframe id="text-frame" srcdoc="<p id='frame-word' style='font:20px Georgia;display:inline-block'>privacy</p>"></iframe></div>
<div class="fixture"><small>Password exclusion fixture</small><input data-testid="password" type="password" value="synthetictest"></div>
</main><aside class="right collapsed" id="right"><div class="tabs"><button id="dictionary-tab" class="tab">Dictionary</button><button id="other-tab" class="tab active">Other</button></div><div id="dictionary-host" class="view-host"></div><div id="other-host" class="view-host active other-content">Another sidebar tab</div></aside></div>
<script src="/harness.js"></script><script src="/main.js"></script><script>void fixture.start(module.exports);</script>
</body></html>
